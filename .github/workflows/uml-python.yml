name: Generate UML Diagrams

on:
  push:
  pull_request:

jobs:
  plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Generate UML
        run: |
          plantuml docs/uml/*.puml

      - name: Upload UML
        uses: actions/upload-artifact@v4
        with:
          name: uml
          path: docs/uml/*.png

