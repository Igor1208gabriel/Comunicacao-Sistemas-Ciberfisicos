name: Generate UML Diagrams

on:
  push:
  pull_request:

jobs:
  plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Generate UML
        run: |
          find Flask/src/docs -name "*.puml" -exec plantuml -tpng {} \;

      - name: Upload UML
        uses: actions/upload-artifact@v4
        with:
          name: uml
          path: Flask/src/docs/*.png
