name: Generate UML Diagrams

on:
  push:
  pull_request:

jobs:
  plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Generate UML
        run: |
          find Flask/src/docs -name "*.puml" -exec plantuml -tsvg {} \;

      - name: Add UML to Job Summary
        run: |
          echo "## 📊 UML Diagrams" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in Flask/src/docs/*.svg; do
            name=$(basename "$file")
            echo "### ${name}" >> $GITHUB_STEP_SUMMARY
            echo "![${name}](${file})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload UML
        uses: actions/upload-artifact@v4
        with:
          name: uml
          path: Flask/src/docs/*.svg
