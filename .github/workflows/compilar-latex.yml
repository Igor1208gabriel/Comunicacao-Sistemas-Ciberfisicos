name: compilar-latex

on:
  push:
    branches: 
      - main
      - dev
      - artigo*

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Cache da instalação completa do TeXLive (VITAL pra ganhar performance)
      - name: Cache TeXLive completo
        uses: actions/cache@v4
        with:
          path: /usr/local/texlive
          key: texlive-install-${{ runner.os }}-v1

      # Instalação (fica instantânea se o cache acima bate)
      - name: Instalar TeXLive
        uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: >
            scheme-basic collection-latexextra collection-bibtexextra
            collection-fontsextra collection-langportuguese
            collection-fontsrecommended biber latexmk abntex2 
            biblatex-abnt tex-gyre
          cache: true
          update-all-packages: false

      - name: Compilar LaTeX
        run: |
          cd LaTeX
          latexmk -pdf -interaction=nonstopmode main.tex

      - name: Upload PDF
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: LaTeX/main.pdf

      - name: Resumo
        run: echo "[PDF Compilado](${{ steps.upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
