name: Analyse with Pylint

on:
  push:
  pull_request:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest opencv-python setuptools

      - name: Run pylint
        run: |
          pylint ROS2/workspace/src --exit-zero
      - name: Install UML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          pip install pylint plantuml

      - name: Generate UML Diagram
        run: |
          mkdir -p docs/uml
          pyreverse ROS2/workspace/src \
            -o png \
            -p ComunicacaoSistemasCiberfisicos \
            --output-directory docs/uml
      
      - name: Upload UML Diagram
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: docs/uml