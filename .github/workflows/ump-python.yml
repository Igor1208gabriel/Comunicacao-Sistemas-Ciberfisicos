name: Generate UML (Python)

on:
  push:
  pull_request:

jobs:
  uml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UML tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint graphviz

      - name: Generate UML Class Diagram
        run: |
          mkdir -p uml
          pyreverse ROS2/workspace/src \
            -o png \
            -p ROS2_Project \
            -d uml

      - name: Add UML to Step Summary
        if: always()
        run: |
          {
            echo "## 🧩 Diagrama UML de Classes (Python)"
            echo ""
            echo "Gerado automaticamente a partir do código Python."
            echo ""
            echo "![UML Class Diagram](uml/classes_ROS2_Project.png)"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload UML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uml-python
          path: uml
